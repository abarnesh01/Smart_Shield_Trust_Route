services:
  # ─── FastAPI Backend (Render Free Web Service) ──────────────────────────────
  - type: web
    name: smart-shield-api
    runtime: python
    plan: free             # ₹0-budget public demo tier (512MB RAM, spins down on idle)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn api.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5
    healthCheckPath: /api/v1/system/health
    envVars:
      # ── Database (External Supabase Free PostgreSQL) ────────────────────────
      # Supply your Supabase connection string in Render Dashboard → Environment:
      # postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false

      # ── Runtime Environment ─────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: staging

      - key: DEBUG
        value: "False"

      - key: LOG_LEVEL
        value: INFO

      # ── Security Secrets (set manually in Render dashboard — NOT in git) ─────
      # Generate with: openssl rand -hex 32
      - key: SECRET_KEY
        sync: false          # sentinel: must be set in Render → Environment

      - key: JWT_SECRET_KEY
        sync: false

      - key: ADMIN_REGISTRATION_CODE
        sync: false          # never expose in source; set in dashboard

      - key: COOKIE_SECURE
        value: "True"        # HTTPS only in staging/production

      # ── CORS: restrict to exact frontend origin ─────────────────────────────
      # Matches Render static site default URL: smart-shield-app.onrender.com
      - key: BACKEND_CORS_ORIGINS
        value: '["https://smart-shield-app.onrender.com"]'

      # ── Bootstrap: disabled in staging unless explicitly needed ────────────
      - key: BOOTSTRAP_DEV_USERS
        value: "false"

      # ── External services (optional; leave blank to use safe fallbacks) ─────
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      - key: TWILIO_ACCOUNT_SID
        sync: false

      - key: TWILIO_AUTH_TOKEN
        sync: false

      - key: TWILIO_PHONE_NUMBER
        sync: false

      - key: EMERGENCY_PHONE
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: EMERGENCY_EMAIL
        sync: false

      - key: SENTRY_DSN
        sync: false

  # ─── React Static Frontend (Render Free Static Site) ────────────────────────
  - type: web
    name: smart-shield-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL for the API backend (baked into React bundle at build time)
      - key: REACT_APP_API_URL
        value: https://smart-shield-api.onrender.com/api/v1
      # Public hostname for WebSocket connection (used by notification service)
      - key: REACT_APP_WS_HOST
        value: smart-shield-api.onrender.com
