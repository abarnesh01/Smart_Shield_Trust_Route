services:
  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: smart-shield-api
    runtime: python
    plan: starter          # change to standard for production workloads
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5
    healthCheckPath: /api/v1/system/health
    envVars:
      # ── Database (injected from managed DB below) ───────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: smart-shield-db
          property: connectionString   # Render injects postgresql://... URL

      # ── Runtime Environment ─────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: staging

      - key: DEBUG
        value: "False"

      - key: LOG_LEVEL
        value: INFO

      # ── Security Secrets (set manually in Render dashboard — NOT in git) ─────
      # Generate with: openssl rand -hex 32
      - key: SECRET_KEY
        sync: false          # sentinel: must be set in Render → Environment

      - key: JWT_SECRET_KEY
        sync: false

      - key: ADMIN_REGISTRATION_CODE
        sync: false          # never expose in source; set in dashboard

      - key: COOKIE_SECURE
        value: "True"        # HTTPS only in staging/production

      # ── CORS: restrict to exact frontend origin ─────────────────────────────
      # Update with your custom staging domain if different from onrender.com
      - key: BACKEND_CORS_ORIGINS
        value: '["https://smart-shield-app.onrender.com"]'

      # ── Bootstrap: disabled in staging unless explicitly needed ────────────
      - key: BOOTSTRAP_DEV_USERS
        value: "false"

      # ── External services (optional; leave blank to use safe fallbacks) ─────
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      - key: TWILIO_ACCOUNT_SID
        sync: false

      - key: TWILIO_AUTH_TOKEN
        sync: false

      - key: TWILIO_PHONE_NUMBER
        sync: false

      - key: EMERGENCY_PHONE
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: EMERGENCY_EMAIL
        sync: false

      - key: SENTRY_DSN
        sync: false

  # ─── React Static Frontend ──────────────────────────────────────────────────
  - type: static
    name: smart-shield-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    publishDir: build
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL for the API backend (baked into React bundle at build time)
      - key: REACT_APP_API_URL
        value: https://smart-shield-api.onrender.com/api/v1
      # Public hostname for WebSocket connection (used by notification service)
      - key: REACT_APP_WS_HOST
        value: smart-shield-api.onrender.com

# ─── Managed PostgreSQL ──────────────────────────────────────────────────────
databases:
  - name: smart-shield-db
    plan: starter            # change to standard for prod
    postgresMajorVersion: 15
    databaseName: smartshield
    user: smartshield
